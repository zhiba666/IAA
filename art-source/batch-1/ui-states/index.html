<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>首代 UI 装配稿 · 批次 1</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <main>
    <p class="eyebrow">ART ASSEMBLY / 01</p>
    <h1>首代界面装配与状态</h1>
    <p class="intro">7 类可编辑装配稿 · 390 × 844 / 320 × 524。文字与数值独立叠加；下方为静态样例，不读取存档、不执行生产或购买。</p>
    <nav id="screens" class="screens" aria-label="装配稿类型"></nav>
    <div class="controls">
      <label>状态 <select id="state"></select></label>
      <label>顶部安全区 <select id="safe-top"><option value="8">8 px</option><option value="24">24 px</option></select></label>
      <label>透明边缘背景 <select id="background"><option value="warm">奶油色</option><option value="dark">深色</option><option value="checker">棋盘格</option></select></label>
    </div>
    <p id="description" class="description" aria-live="polite"></p>
    <section class="comparisons" aria-label="两种校对尺寸">
      <article class="viewport-card"><h2>主校对 · 390 × 844</h2><div id="large" class="phone" data-size="large"></div></article>
      <article class="viewport-card"><h2>紧凑校对 · 320 × 524</h2><div id="compact" class="phone compact" data-size="compact"></div></article>
    </section>
    <p id="asset-status" class="validation" aria-live="polite"></p>
    <p class="footnote">场景区使用独立机体 PNG 作三工位观察位置示意；完整设备分层与产线路径请查看本批场景装配稿。设备图片不包含文字。页面中的点击只切换审阅样例。</p>
    <div class="document-links"><a href="spec/layout.json">尺寸与布局数据</a><a href="state-coverage.md">状态覆盖表</a><a href="motion-spec.json">6 组动效数据</a><a href="motion-spec.md">动效规范</a></div>
  </main>
  <script src="preview.js"></script>
</body>
</html>
