<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>爆米花厂 · 第 0 批美术资源</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e4;color:#164e52;font:15px/1.6 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1260px;margin:auto;padding:32px}h1{margin:0;font-size:32px}h2{margin:30px 0 10px;font-size:22px}p{margin:8px 0;color:#55706e}a{color:#16787f}button{font:inherit;cursor:pointer;border:1px solid #7aa9a6;border-radius:8px;padding:8px 18px;background:#fffaf0;color:#164e52}button[aria-pressed=true]{background:#166b72;color:#fff}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{padding:12px;background:#fffaf0;border:1px solid #dbdcd0;border-radius:14px;overflow:hidden}.sample{height:220px;display:flex;align-items:center;justify-content:center;background-color:#fff;background-image:conic-gradient(#e2e6df 25%,transparent 0 50%,#e2e6df 0 75%,transparent 0);background-size:24px 24px;border-radius:8px}.sample img{max-width:94%;max-height:92%;object-fit:contain}.card code{display:block;font-size:12px;margin-top:9px;overflow-wrap:anywhere}.card small{color:#6b7d77}.dark .sample{background:#143d44}.light .sample{background:#fff}.ui-row{display:flex;gap:15px;flex-wrap:wrap;align-items:center;padding:20px;background:#e9e5dc;border-radius:12px}.skin{border:11px solid transparent;border-image-slice:32 fill;border-image-width:11px;height:46px;min-width:128px;text-align:center;line-height:24px;font-weight:750;color:#074d53}.skin.primary{border-image-source:url('../../assets/art/ui/ui_button_primary.png')}.skin.secondary{border-image-source:url('../../assets/art/ui/ui_button_secondary.png')}.skin.disabled{border-image-source:url('../../assets/art/ui/ui_button_disabled.png');color:#576d68}.skin.coin{border-image-source:url('../../assets/art/ui/ui_hud_coin.png');color:#fff}.pressed{transform:translateY(1px);filter:brightness(.95)}.selected{outline:2px solid #d6a93a;outline-offset:2px;border-radius:11px}#status{font-size:13px}object{width:100%;height:auto;aspect-ratio:1.15;border:1px solid #dcdccc;border-radius:14px;background:#fffaf0}@media(max-width:500px){main{padding:18px}h1{font-size:25px}.grid{grid-template-columns:1fr 1fr;gap:10px}.sample{height:150px}.card{padding:8px}.card code{font-size:10px}}
</style>
<main><p>ART SAMPLE / 00 · 2026-09-09</p><h1>装杯机与基础部件样板</h1><p>仅美术资源。独立 PNG、透明边缘和分层组合预览，不加载游戏、不读取存档。</p>
<p><a href="contact-sheet.png">打开资源总览图</a> · <a href="assembly.svg">打开可编辑装配样板</a> · <a href="../../assets/art/manifest.json">尺寸与锚点清单</a></p>
<div class="toolbar" aria-label="透明背景检查"><button aria-pressed="true" data-bg="">棋盘格</button><button aria-pressed="false" data-bg="light">白色背景</button><button aria-pressed="false" data-bg="dark">深色背景</button></div><p id="status">正在检查独立图片…</p>
<section class="grid" id="assets"></section>
<h2>九宫格与文字分层示意</h2><p>下列标签由此预览页叠加，PNG 内没有文字或数值。</p><div class="ui-row"><div class="skin coin">金币数值</div><div class="skin primary">主要操作</div><div class="skin primary pressed">按下示意</div><div class="skin secondary selected">选中示意</div><div class="skin disabled">不可用</div><div class="skin secondary" style="width:280px">可伸缩的宽按钮</div></div>
<h2>分层装配示意</h2><p>仅核对部件比例、遮挡和填充，不代表正式游戏状态绑定。</p><img src="assembly-preview.png" alt="装杯机、杯口四档填充、两向输送带和仓体三档库存的装配样板" style="display:block;width:100%;height:auto;border-radius:14px"></main>
<script>
for(const button of document.querySelectorAll('[data-bg]'))button.onclick=()=>{document.body.className=button.dataset.bg;for(const b of document.querySelectorAll('[data-bg]'))b.setAttribute('aria-pressed',String(b===button));};
fetch('../../assets/art/manifest.json').then(r=>r.json()).then(async manifest=>{
 const checks=manifest.entries.map(entry=>new Promise(resolve=>{
  const card=document.createElement('article');card.className='card';const display=document.createElement('div');display.className='sample';const img=new Image();img.alt=entry.id;
  img.onload=()=>resolve({id:entry.id,ok:img.naturalWidth===entry.width&&img.naturalHeight===entry.height});img.onerror=()=>resolve({id:entry.id,ok:false});img.src='../../'+entry.path;display.append(img);card.append(display);
  const id=document.createElement('code');id.textContent=entry.id;card.append(id);const size=document.createElement('small');size.textContent=`${entry.width} × ${entry.height} px · RGBA`;card.append(size);document.querySelector('#assets').append(card);
 }));const results=await Promise.all(checks);document.querySelector('#status').textContent=`已检查 ${results.length} 张 PNG：${results.filter(r=>r.ok).length} 张加载和尺寸匹配。尚未游戏接入。`;
}).catch(()=>document.querySelector('#status').textContent='清单加载失败，请通过本目录的 preview-server.cjs 打开。');
</script></html>
