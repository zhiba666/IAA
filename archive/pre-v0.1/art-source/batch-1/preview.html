<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首代产线 · 第二份美术资源包</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3eee2;color:#14585e;font:14px/1.5 system-ui,'Microsoft YaHei',sans-serif}main{max-width:1320px;margin:auto;padding:32px}h1{font-size:32px;margin:0 0 8px}h2{font-size:20px;margin:26px 0 12px}p{color:#5b7470}a{color:#087e84}nav{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}button,nav a{border:1px solid #a5bdb3;border-radius:9px;background:#fffbf0;padding:10px 16px;min-height:44px;font:inherit;color:#175e64;text-decoration:none;cursor:pointer}.summary{padding:14px;border-left:4px solid #cda73e;background:#fff9e9}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}.asset{background:#fffaf0;border:1px solid #d8dfd4;border-radius:12px;overflow:hidden}.swatch{height:175px;background:conic-gradient(#e4e6df 25%,#fafbf7 0 50%,#e4e6df 0 75%,#fafbf7 0);background-size:20px 20px;display:flex;align-items:center;justify-content:center;padding:12px}.swatch img{max-width:100%;max-height:100%;object-fit:contain}.asset p{margin:10px 12px;font-size:11px;overflow-wrap:anywhere}.dark .swatch{background:#13363d}.white .swatch{background:white}.preview{width:100%;border:1px solid #c9d6ca;border-radius:14px;background:#faf6ea}small{color:#6e8075}.rigs{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rigs object{width:100%;min-height:360px}#qa{font-weight:650;color:#1c7662}@media(max-width:650px){main{padding:20px 12px}.rigs{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.swatch{height:150px}h1{font-size:25px}}
</style><main><small>POPCORN FACTORY · ARTWORK BATCH 01</small><h1>首代产线资源补全</h1><p>接续批次 0 的第二份美术交付包。独立 PNG、可编辑分层与状态装配稿。</p><div class="summary">静态美术审阅 · 不运行生产模拟 · 不读取或写入游戏存档</div><nav><a href="ui-states/index.html">七类界面 · 双尺寸预览</a><a href="assembly.json">装配坐标</a><a href="../../assets/art/manifest.json">资源清单</a><a href="ui-states/motion-spec.md">六组动效规范</a></nav><p id="qa">正在核对资源…</p><div><button data-bg="checker">棋盘格</button> <button data-bg="white">白色</button> <button data-bg="dark">深色</button></div><h2>首代构图与分层</h2><a href="scene-preview.svg"><img class="preview" src="scene-preview.png" alt="三工位两仓、两档构图与八种库存状态"></a><div class="rigs"><a href="machinery/assembly.svg"><img class="preview" src="machinery/assembly-preview.png" alt="十二种机械与出货装配组合"></a><a href="core/assembly.svg"><img class="preview" src="core/assembly-preview.png" alt="双杯托与纸箱五种装配状态"></a></div><h2>本批独立素材</h2><div class="grid" id="assets"></div><p>数字、中文、库存、价格与进度均为独立文字或状态层，未烘焙入 PNG。完整游戏接入与最终动态验收留待后续授权。</p></main><script>
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>document.body.className=b.dataset.bg);
(async()=>{const manifest=await(await fetch('../../assets/art/manifest.json')).json();const entries=manifest.entries.filter(e=>e.batch===1);const results=await Promise.all(entries.map(e=>new Promise(resolve=>{const card=document.createElement('article');card.className='asset';const box=document.createElement('div');box.className='swatch';const img=new Image();img.alt=e.id;img.src='../../'+e.path;box.append(img);const p=document.createElement('p');p.textContent=e.id+' · '+e.width+' × '+e.height+' px';card.append(box,p);document.querySelector('#assets').append(card);img.onload=()=>resolve({id:e.id,ok:img.naturalWidth===e.width&&img.naturalHeight===e.height});img.onerror=()=>resolve({id:e.id,ok:false});})));window.assetReviewReport={total:entries.length,passed:results.filter(e=>e.ok).length,failures:results.filter(e=>!e.ok)};document.querySelector('#qa').textContent=window.assetReviewReport.passed+' / '+entries.length+' 新资源加载与尺寸一致';})();
</script></html>
