<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA · 前 5 分钟真实试玩记录</title>
<style>
:root{--game-width:390px;--game-height:844px;color-scheme:light}
*{box-sizing:border-box}body{margin:0;min-width:880px;min-height:calc(var(--game-height) + 80px);background:#edf1eb;color:#243d30;font-family:system-ui,'Microsoft YaHei',sans-serif}
header{position:absolute;left:20px;top:8px;right:20px;height:46px;white-space:nowrap}
h1{margin:0;font-size:18px;line-height:24px}header p{margin:0;font-size:12px;line-height:20px;color:#52695a}
#game{position:absolute;left:20px;top:60px;width:var(--game-width);height:var(--game-height);border:0;box-shadow:0 0 0 1px #c8d4c8}
aside{position:absolute;top:60px;left:calc(var(--game-width) + 44px);right:20px;min-width:400px;max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid #d4dfd2;border-radius:8px;padding:14px}
#status{margin:0 0 8px;font-size:15px;font-weight:650}aside p{font-size:12px;line-height:1.5;margin:8px 0;color:#52695a}
#funnel{padding:10px;background:#f0f7ed;border-radius:6px;font-size:13px;line-height:1.7}
button{font:inherit;font-size:13px;padding:8px 12px;border:1px solid #6d8f72;border-radius:6px;background:#f0f7ed;color:#254b31;cursor:pointer}
pre{font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;margin:12px 0 0;color:#233d32}
</style>
</head>
<body>
<header><h1>QA · 前 5 分钟真实试玩记录</h1><p>左侧人工试玩；右侧每秒只读观察。不会改变游戏存档或时间。首次事件以前台约 ±1 秒精度记录。</p></header>
<iframe id="game" title="QA 真实游戏视口"></iframe>
<aside aria-label="QA 只读报告"><p id="status" role="status">QA 正在加载游戏…</p><button id="download" type="button">手动下载 QA 报告 JSON</button><p id="funnel" aria-label="本次体验漏斗"></p><p>漏斗使用游戏实际事件的营业时间；状态变化采样作为辅助。已有存档进度见 baseline；本次未记录不代表该目标从未完成。广告按入口类型记录曝光、点击、请求、完成、取消、失败与发奖；完成回调和实际发奖分别计数。广告后 30 秒记录包括期间操作及其他奖励，仅说明观察到的推进。页面刷新会清除本页记录；下载含全部采样与有上限的事件记录。读取均不会重置游戏存档。</p><pre id="report" aria-label="QA JSON 报告"></pre></aside>
<script>(function monitor() {
  'use strict';
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'low' ? 'low' : 'normal';
  function dimension(key, fallback, minimum, maximum) {
    const value = Number(params.get(key));
    return Number.isInteger(value) && value >= minimum && value <= maximum ? value : fallback;
  }
  const width = dimension('width', mode === 'low' ? 320 : 390, 240, 640);
  const height = dimension('height', mode === 'low' ? 568 : 844, 480, 1280);
  document.documentElement.style.setProperty('--game-width', width + 'px');
  document.documentElement.style.setProperty('--game-height', height + 'px');
  const frame = document.getElementById('game');
  const output = document.getElementById('report');
  const status = document.getElementById('status');
  const funnel = document.getElementById('funnel');
  const report = {
    version: 2,
    purpose: '本地 QA：人工操作真实游戏，只读记录前 5 分钟体验',
    mode, viewport: { width, height, iframeLeft: 20, iframeTop: 60 },
    startedAt: new Date().toISOString(), samplingIntervalMs: 1000,
    timing: '首次事件按状态变化采样，前台约 ±1 秒；playedSecondsRange 是实际观察区间，后台节流时以该区间为准。',
    errorCapture: 'iframe 加载后监听 error / unhandledrejection；诊断入口未建立会显示等待状态。',
    baseline: null, latest: null,
    milestones: { tap: null, upgrade: null, burst: null, order: null, evolve: null, quest: null },
    experience: null,
    errors: [], samples: [], analytics: [], iframeLoads: 0,
    droppedSamples: 0, droppedErrors: 0
  };
  let previous = null;
  let ready = false;
  let boundWindow = null;
  let lastReadError = '';
  const copy = value => JSON.parse(JSON.stringify(value));
  function render() {
    const experience = report.experience;
    const labels = [['first_tap', '首次生产'], ['first_upgrade', '首次升级'], ['first_burst', '免费爆锅'],
      ['first_order', '首单领取'], ['first_evolve', '首次换代']];
    funnel.textContent = experience ? labels.map(([key, title]) => {
      const milestone = experience.milestones && experience.milestones[key];
      return title + '：' + (milestone ? milestone.playedSeconds.toFixed(1) + ' 秒' : '本次未记录');
    }).join(' · ') : '等待本次游戏的事件级体验记录…';
    output.textContent = JSON.stringify({
      purpose: report.purpose, mode, viewport: report.viewport,
      samplingIntervalMs: report.samplingIntervalMs, timing: report.timing,
      errorCapture: report.errorCapture, iframeLoads: report.iframeLoads,
      baseline: report.baseline, latest: report.latest, milestones: report.milestones,
      errors: report.errors, sampleCount: report.samples.length,
      droppedSamples: report.droppedSamples, droppedErrors: report.droppedErrors,
      experience: experience ? {
        scope: experience.scope, timing: experience.timing, baseline: experience.baseline,
        target: experience.target, recommendation: experience.recommendation, milestones: experience.milestones, tutorialSteps: experience.tutorialSteps,
        ads: experience.ads, pendingOutcomes: experience.pendingOutcomes,
        droppedEvents: experience.droppedEvents, droppedOutcomes: experience.droppedOutcomes,
        recentEvents: experience.events.slice(-12)
      } : null,
      recentAnalytics: report.analytics.slice(-8)
    }, null, 2);
  }
  function recordError(kind, details) {
    report.errors.push({ kind, at: new Date().toISOString(),
      playedSeconds: report.latest ? report.latest.playedSeconds : null, ...details });
    if (report.errors.length > 100) { report.errors.shift(); report.droppedErrors++; }
    render();
  }
  function captureError(event) {
    recordError('error', { message: String(event.message || '资源加载错误'),
      filename: event.filename || event.target && event.target.src || '',
      line: event.lineno || null, column: event.colno || null });
  }
  function captureRejection(event) {
    const reason = event.reason;
    recordError('unhandledrejection', { message: String(reason && (reason.stack || reason.message) || reason) });
  }
  function attachErrors() {
    if (boundWindow) {
      boundWindow.removeEventListener('error', captureError, true);
      boundWindow.removeEventListener('unhandledrejection', captureRejection);
    }
    boundWindow = frame.contentWindow;
    boundWindow.addEventListener('error', captureError, true);
    boundWindow.addEventListener('unhandledrejection', captureRejection);
  }
  function sample() {
    try {
      const api = frame.contentWindow && frame.contentWindow.__POPCORN__;
      if (!api || typeof api.snapshot !== 'function' || typeof api.analytics !== 'function') {
        status.textContent = 'QA 等待游戏只读诊断入口；若持续等待，请检查启动错误。';
        return;
      }
      const view = api.snapshot();
      const state = view.state;
      const current = {
        observedAt: new Date().toISOString(), playedSeconds: state.playedSeconds,
        coins: state.coins, totalProduced: state.totalProduced,
        taps: state.taps, bursts: state.bursts,
        machine: { index: state.machine, name: view.machine.name },
        upgrades: view.upgrades.map(({ key, level, canBuy, cost }) => ({ key, level, canBuy, cost })),
        tutorial: view.tutorial, goal: view.goal,
        quests: view.quests, brand: view.brand, productionModes: view.productionModes, factoryMilestones: view.milestones,
        order: { ready: view.order.ready, index: view.order.index, mainIndex: state.orderIndex,
          loopIndex: state.loopIndex, name: view.order.name, progress: view.order.progress, stageProgress: view.order.stageProgress,
          target: view.order.target, reward: view.order.reward },
        canEvolve: view.canEvolve, evolveReason: view.evolveReason,
        production: view.production, energy: view.energy, boostSeconds: view.boostSeconds
      };
      const analytics = api.analytics();
      report.analytics = Array.isArray(analytics) ? copy(analytics) : [];
      if (typeof api.experience === 'function') report.experience = copy(api.experience());
      if (!report.baseline) report.baseline = copy(current);
      if (previous && current.playedSeconds < previous.playedSeconds) {
        recordError('observation-reset', { message: '检测到游戏时间回退，本次后续采样从当前状态继续；此前首次事件记录保留。' });
        previous = null;
      }
      if (previous) {
        const changed = {
          tap: current.taps > previous.taps,
          upgrade: current.upgrades.some((item, i) => item.level > previous.upgrades[i].level),
          burst: current.bursts > previous.bursts,
          order: current.order.mainIndex > previous.order.mainIndex || current.order.loopIndex > previous.order.loopIndex,
          evolve: current.machine.index > previous.machine.index,
          quest: !!current.quests && !!previous.quests && current.quests.claimedCount > previous.quests.claimedCount
        };
        for (const kind of Object.keys(changed)) {
          if (!changed[kind] || report.milestones[kind]) continue;
          const relevant = report.analytics.filter(entry => entry.event === kind);
          const event = relevant.find(entry => entry.time >= Date.parse(previous.observedAt)) || relevant.at(-1) || null;
          report.milestones[kind] = {
            playedSeconds: current.playedSeconds,
            playedSecondsRange: [previous.playedSeconds, current.playedSeconds],
            source: '每秒只读状态变化', event: event ? copy(event) : null
          };
        }
      }
      previous = current;
      report.latest = current;
      report.samples.push(copy(current));
      if (report.samples.length > 3600) { report.samples.shift(); report.droppedSamples++; }
      ready = true;
      lastReadError = '';
      status.textContent = 'QA 只读采样中 · 游戏 ' + current.playedSeconds.toFixed(1) + ' 秒 · ' + width + ' × ' + height;
      render();
    } catch (error) {
      const message = String(error && error.message || error);
      if (message !== lastReadError) { recordError('diagnostic-read', { message }); lastReadError = message; }
      status.textContent = 'QA 读取失败：' + message;
    }
  }
  frame.addEventListener('load', () => {
    report.iframeLoads++;
    previous = null;
    attachErrors();
    sample();
  });
  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = 'experience-' + mode + '-' + width + 'x' + height + '-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
  render();
  frame.src = '/index.html';
  setInterval(() => { if (ready || report.iframeLoads) sample(); }, 1000);
})();</script>
</body>
</html>
