<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#f5eedc">
  <meta name="description" content="从整盘搬运开始，逐段购买自动补料，改造真实生产工位，建立无人搬运的爆米花工厂。">
  <title>小小爆米花厂 · v1.1</title>
  <style>
    :root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px)}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9eee5}
    body{touch-action:none;overscroll-behavior:none;font-family:system-ui,'Microsoft YaHei',sans-serif}
    canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none}
    .loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#264333;gap:12px;pointer-events:none}
    .loading strong{font-size:24px}.loading span{font-size:13px;color:#6e7d71}
    .sr-only{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  </style>
</head>
<body>
  <div class="loading" id="loading"><strong>小小爆米花厂</strong><span>正在给第一锅玉米加热…</span></div>
  <p class="sr-only" id="instructions">按住待装仓货盘，拖到装杯入口松手，再把待发仓货盘拖到出货入口松手。只有拖拽可以手动搬运；误投或取消会归还货盘。分别购买两段自动转运后，无需手动搬运仍会出货。物流改造增加批量和仓位，点击机器打开设备改造窗口。只有真实出货结算金币，自动试运行达标后可扩建。新品页可查看商品、工艺和直售美术，筹备中内容仅供展示。快捷键：1、2、3选择工位，Enter购买当前报价，L物流，M扩建，S设置，P新品，Escape取消搬运或关闭窗口。</p>
  <script>globalThis.POPCORN_CONFIG={allowSimulatedAds:false,appId:'',rewardAdUnitId:'',interstitialAdUnitId:''};</script>
  <script src="game.bundle.js"></script>
</body>
</html>
